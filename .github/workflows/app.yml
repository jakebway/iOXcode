name: App - build the iOXcode IPA

# Builds the iOXcode app (unsigned IPA for FlareStore) and puts the finished compiler inside it.
# Needs a successful "Compiler" run first (it provides the compiler-dist artifact).

on:
  workflow_dispatch:
    inputs:
      with_compiler:
        description: "Embed the compiler (turn off to test the app without it)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest stable Xcode
        run: |
          SEL=$(ls -d /Applications/Xcode*.app | grep -viE 'beta|rc|preview' | sort -V | tail -1)
          SEL=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$SEL")
          sudo xcode-select -s "$SEL/Contents/Developer"
          echo "DEVELOPER_DIR=$SEL/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Get the newest compiler build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.with_compiler }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          retry() { for i in 1 2 3 4 5 6; do "$@" && return 0; echo "attempt $i failed, waiting"; sleep $((i * 10)); done; return 1; }
          ID=$(retry gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=compiler-dist&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -z "$ID" ]; then echo "::warning::No compiler-dist artifact yet. Building the app WITHOUT the compiler."; exit 0; fi
          retry gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > /tmp/compiler.zip
          mkdir -p /tmp/compiler && unzip -oq /tmp/compiler.zip -d /tmp/compiler
          ls -lh /tmp/compiler
          D=/tmp/compiler/libSwiftCompilerBridge.dylib
          echo "COMPILER_DYLIB=$D" >> "$GITHUB_ENV"
          echo "COMPILER_DIR=/tmp/compiler" >> "$GITHUB_ENV"
          {
            echo "### Compiler library check"; echo '```'
            file "$D"; lipo -info "$D" 2>&1 || true
            otool -l "$D" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | head -8
            echo "--- exported compiler entry points"
            nm -gU "$D" 2>/dev/null | grep -E "swift_compiler_" | head -12
            echo "--- libraries it needs"
            otool -L "$D" | head -20
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          mkdir -p ci-out
          cd app
          xcodegen generate
          xcodebuild -project iOXcode.xcodeproj -scheme iOXcode -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > ../ci-out/xcodebuild.log 2>&1 || rc=$?
          cd ..
          grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" ci-out/xcodebuild.log | sort -u | head -60 > ci-out/errors.txt || true
          { echo "### Build errors"; echo '```'; cat ci-out/errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit ${rc:-0}

      - name: Publish the build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/push-logs.sh ci-out "app-${{ github.run_id }}"

      - name: Assemble the IPA
        run: |
          APP=$(ls -d app/build/Build/Products/Release-iphoneos/iOXcode.app)
          if [ -n "${COMPILER_DYLIB:-}" ]; then
            mkdir -p "$APP/Frameworks"
            cp "$COMPILER_DIR"/*.dylib "$APP/Frameworks/"
            echo "compiler embedded:"; ls -lh "$APP/Frameworks/"
          else
            echo "no compiler embedded"
          fi
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry iOXcode.ipa Payload
          ls -lh iOXcode.ipa

      - name: Check the IPA is well formed
        run: |
          {
            echo "### IPA check"; echo '```'
            unzip -tq iOXcode.ipa | tail -1
            ls -l iOXcode.ipa | awk '{print "size: " $5/1048576 " MB"}'
            unzip -l iOXcode.ipa | awk 'NR>3{print $4}' | cut -d/ -f1-3 | sort -u | head -40
            for f in Payload/iOXcode.app/Frameworks/*.dylib; do
              echo "$(basename "$f"): $(vtool -show-build "$f" 2>/dev/null | grep -E 'platform|minos' | tr -s ' ' | tr '\n' ' ')"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: iOXcode-ipa
          path: iOXcode.ipa
          retention-days: 30
# rebuilt with the full compiler bundle
