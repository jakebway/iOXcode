name: App - build the iOXcode IPA

# Builds the iOXcode app (unsigned IPA for FlareStore) and puts the finished compiler inside it.
# Needs a successful "Compiler" run first (it provides the compiler-dist artifact).

on:
  workflow_dispatch:
    inputs:
      with_compiler:
        description: "Embed the compiler (turn off to test the app without it)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/ci/install-python.py"
      - ".github/workflows/app.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest stable Xcode
        run: |
          SEL=$(ls -d /Applications/Xcode*.app | grep -viE 'beta|rc|preview' | sort -V | tail -1)
          SEL=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$SEL")
          sudo xcode-select -s "$SEL/Contents/Developer"
          echo "DEVELOPER_DIR=$SEL/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Get the newest compiler build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.with_compiler }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          retry() { for i in 1 2 3 4 5 6; do "$@" && return 0; echo "attempt $i failed, waiting"; sleep $((i * 10)); done; return 1; }
          ID=$(retry gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=compiler-dist&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -z "$ID" ]; then echo "::warning::No compiler-dist artifact yet. Building the app WITHOUT the compiler."; exit 0; fi
          retry gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > /tmp/compiler.zip
          mkdir -p /tmp/compiler && unzip -oq /tmp/compiler.zip -d /tmp/compiler
          ls -lh /tmp/compiler
          D=/tmp/compiler/libSwiftCompilerBridge.dylib
          echo "COMPILER_DYLIB=$D" >> "$GITHUB_ENV"
          echo "COMPILER_DIR=/tmp/compiler" >> "$GITHUB_ENV"
          {
            echo "### Compiler library check"; echo '```'
            file "$D"; lipo -info "$D" 2>&1 || true
            otool -l "$D" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | head -8
            echo "--- exported compiler entry points"
            nm -gU "$D" 2>/dev/null | grep -E "swift_compiler_" | head -12
            echo "--- libraries it needs"
            otool -L "$D" | head -20
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Get the clang headers that match the compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          retry() { for i in 1 2 3 4 5 6; do "$@" && return 0; echo "attempt $i failed, waiting"; sleep $((i * 10)); done; return 1; }
          ID=$(retry gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=clang-resource&per_page=1" --jq '.artifacts[0].id // empty')
          if [ -z "$ID" ]; then echo "::warning::No clang-resource artifact yet (run the Clang headers workflow)."; exit 0; fi
          retry gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > /tmp/clang.zip
          mkdir -p /tmp/clang && unzip -oq /tmp/clang.zip -d /tmp/clang
          ls /tmp/clang | head; echo "CLANG_RESOURCE=/tmp/clang" >> "$GITHUB_ENV"

      - name: Get Python for iOS (runs project build scripts on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          retry() { for i in 1 2 3 4 5 6; do "$@" && return 0; echo "attempt $i failed, waiting"; sleep $((i * 10)); done; return 1; }
          TAG=$(retry gh api "repos/beeware/Python-Apple-support/releases?per_page=30" --jq '[.[] | select(.tag_name | startswith("3.14-"))][0].tag_name')
          echo "Python support release: $TAG"
          mkdir -p /tmp/py && cd /tmp/py
          retry gh release download "$TAG" -R beeware/Python-Apple-support -p '*iOS-support*' --clobber
          tar -xzf *iOS-support*.tar.gz
          ls; cat VERSIONS || true
          ls Python.xcframework Python.xcframework/ios-arm64 | head -30
          # packages build scripts commonly need: Pillow (images) and PyYAML (pure Python)
          mkdir -p /tmp/wheels /tmp/app_packages
          python3 -m pip download --only-binary=:all: --platform ios_13_0_arm64_iphoneos --python-version 3.14 --implementation cp --no-deps pillow -d /tmp/wheels
          python3 -m pip download --no-binary=:all: --no-deps --no-build-isolation pyyaml -d /tmp/wheels || python3 -m pip download --no-deps pyyaml -d /tmp/wheels
          python3 -m pip download --only-binary=:all: --no-deps certifi -d /tmp/wheels   # CA bundle: the embedded Python has no system certificates
          for w in /tmp/wheels/*.whl; do unzip -oq "$w" -d /tmp/app_packages; done
          for t in /tmp/wheels/*.tar.gz; do [ -f "$t" ] || continue; mkdir -p /tmp/sd && tar -xzf "$t" -C /tmp/sd; cp -R /tmp/sd/*/lib/yaml /tmp/app_packages/ 2>/dev/null || true; done
          find /tmp/app_packages -maxdepth 2 | head -40
          find /tmp/app_packages -name "*.dylib" -o -name "*.so" | head -20
          echo "PY_XCF=/tmp/py/Python.xcframework" >> "$GITHUB_ENV"
          echo "PY_PACKAGES=/tmp/app_packages" >> "$GITHUB_ENV"

      - name: Build the app (unsigned)
        run: |
          set -o pipefail
          mkdir -p ci-out
          cd app
          xcodegen generate
          xcodebuild -project iOXcode.xcodeproj -scheme iOXcode -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > ../ci-out/xcodebuild.log 2>&1 || rc=$?
          cd ..
          grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" ci-out/xcodebuild.log | sort -u | head -60 > ci-out/errors.txt || true
          { echo "### Build errors"; echo '```'; cat ci-out/errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit ${rc:-0}

      - name: Publish the build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/push-logs.sh ci-out "app-${{ github.run_id }}"

      - name: Assemble the IPA
        run: |
          APP=$(ls -d app/build/Build/Products/Release-iphoneos/iOXcode.app)
          if [ -n "${COMPILER_DYLIB:-}" ]; then
            mkdir -p "$APP/Frameworks"
            cp "$COMPILER_DIR"/*.dylib "$APP/Frameworks/"
            # macro plugins must be frameworks (the compiler only loads plugins from Frameworks/<Name>.framework/<Name>)
            for d in "$COMPILER_DIR"/plugins/lib*.dylib; do
              [ -f "$d" ] || continue
              n=$(basename "$d" .dylib); n=${n#lib}
              fw="$APP/Frameworks/$n.framework"; mkdir -p "$fw"
              cp "$d" "$fw/$n"
              install_name_tool -id "@rpath/$n.framework/$n" "$fw/$n"
              install_name_tool -add_rpath "@loader_path/.." "$fw/$n" 2>/dev/null || true
              cat > "$fw/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>$n</string>
          <key>CFBundleIdentifier</key><string>com.jakebway.ioxcode.plugin.$n</string>
          <key>CFBundleName</key><string>$n</string>
          <key>CFBundlePackageType</key><string>FMWK</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>MinimumOSVersion</key><string>16.0</string>
          </dict></plist>
          PLIST
              echo "plugin framework: $n"
            done
            echo "compiler embedded:"; ls -lh "$APP/Frameworks/"
          else
            echo "no compiler embedded"
          fi
          if [ -n "${CLANG_RESOURCE:-}" ]; then cp -R "$CLANG_RESOURCE" "$APP/ClangResource"; echo "clang headers embedded: $(du -sh "$APP/ClangResource" | cut -f1)"; fi
          if [ -n "${PY_XCF:-}" ]; then
            cp app/Python/*.py "$PY_PACKAGES"/
            python3 scripts/ci/install-python.py "$PY_XCF" "$APP" "$PY_PACKAGES"
            echo "python embedded: $(du -sh "$APP/python" | cut -f1) stdlib, $(du -sh "$APP/app_packages" | cut -f1) packages"
          fi
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry iOXcode.ipa Payload
          ls -lh iOXcode.ipa

      - name: Check the IPA is well formed
        run: |
          {
            echo "### IPA check"; echo '```'
            unzip -tq iOXcode.ipa | tail -1
            ls -l iOXcode.ipa | awk '{print "size: " $5/1048576 " MB"}'
            unzip -l iOXcode.ipa | awk 'NR>3{print $4}' | cut -d/ -f1-3 | sort -u | head -40
            ls Payload/iOXcode.app/Frameworks | head -80
            for f in Payload/iOXcode.app/Frameworks/*.dylib; do
              echo "$(basename "$f"): $(vtool -show-build "$f" 2>/dev/null | grep -E 'platform|minos' | tr -s ' ' | tr '\n' ' ')"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: iOXcode-ipa
          path: iOXcode.ipa
          retention-days: 30
# rebuilt with the full compiler bundle
# with matching clang headers
