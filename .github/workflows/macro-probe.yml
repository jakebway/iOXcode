name: macro-probe
# Research aid: prints what Apple's SwiftData / Preview macros expand to, so iOXcode's own expansion can be checked against it.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Dump macro expansions
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios17.0 -parse-as-library -typecheck \
            -Xfrontend -dump-macro-expansions tools/macro-probe/Probe.swift 2>&1 | tee /tmp/expansions.txt || true
          echo "=========== PREDICATES ==========="
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios17.0 -parse-as-library -typecheck \
            -Xfrontend -dump-macro-expansions tools/macro-probe/Predicates.swift 2>&1 | tee /tmp/predicates_$(echo $RUNNER_NAME | tr -c 'a-z0-9' _).txt | head -5000 || true
          echo "=========== PROBE2 ==========="
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios17.0 -parse-as-library -typecheck \
            -Xfrontend -dump-macro-expansions tools/macro-probe/Probe2.swift 2>&1 | tee -a /tmp/expansions.txt || true
      - name: Check iOXcode's own @Model expansion compiles (no SwiftData macros involved)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p /tmp/expanded
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "app/Python")
          import ioxmacro
          src = open("tools/macro-probe/Models.swift").read()
          out = ioxmacro.expand_source(src)
          open("/tmp/expanded/Models.swift", "w").write(out)
          print(out)
          PY
          # the real plugin is pointed at a path that does not exist: any leftover @Model/@Attribute would fail
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios17.0 -parse-as-library -typecheck \
            -Xfrontend -disable-implicit-string-processing-module-import \
            /tmp/expanded/Models.swift 2>&1 | tee /tmp/check.txt
          echo "typecheck exit: ${PIPESTATUS[0]}"
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "app/Python")
          import ioxmacro
          src = open("tools/macro-probe/Entry.swift").read()
          out = ioxmacro.expand_source(src)
          assert "@Entry" not in out
          open("/tmp/expanded/Entry.swift", "w").write(out)
          PY
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "app/Python")
          import ioxmacro
          src = open("tools/macro-probe/QueryCheck.swift").read()
          out = ioxmacro.expand_source(src)
          assert "@Query" not in out and "@Model" not in out
          open("/tmp/expanded/QueryCheck.swift", "w").write(out)
          PY
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios17.0 -parse-as-library -typecheck /tmp/expanded/QueryCheck.swift 2>&1 | tee /tmp/check_query.txt
          echo "query typecheck exit: ${PIPESTATUS[0]}"
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "app/Python")
          import ioxmacro
          src = open("tools/macro-probe/Predicates.swift").read()
          out = ioxmacro.expand_predicate(src)
          out = "\n".join(l for l in out.split("\n") if "#Predicate" not in l and not l.startswith("func infer"))
          open("/tmp/expanded/Predicates.swift", "w").write(out)
          PY
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios18.0 -parse-as-library -typecheck /tmp/expanded/Predicates.swift 2>&1 | tee /tmp/check_pred.txt
          echo "predicate typecheck exit: ${PIPESTATUS[0]}"
          for MODE in 5 6; do
            xcrun swiftc -sdk "$SDK" -target arm64-apple-ios17.0 -parse-as-library -typecheck -swift-version $MODE /tmp/expanded/Entry.swift 2>&1 | tee /tmp/check_entry.txt
            echo "entry typecheck (swift $MODE) exit: ${PIPESTATUS[0]}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macro-expansions-${{ matrix.runner }}
          path: /tmp/expansions.txt
