name: SDK layout probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - run: |
          SEL=$(ls -d /Applications/Xcode_27*.app | grep -viE 'beta|rc|preview' | sort -V | tail -1)
          export DEVELOPER_DIR="$SEL/Contents/Developer"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          TC=$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr
          for fw in SwiftUICore SwiftUI Observation Foundation SwiftData; do
            G=$(find $SDK/System/Library/Frameworks/$fw.framework $SDK/usr/lib/swift/$fw.swiftmodule -name 'arm64e-apple-ios.swiftinterface' 2>/dev/null | head -1)
            [ -n "$G" ] && { echo "== $fw"; grep -o "public macro [A-Za-z_]*[^=]*" "$G" | cut -c1-110 | sort -u | head -40; }
          done
          F=$(find $SDK/System/Library/Frameworks/SwiftUICore.framework -name 'arm64e-apple-ios.swiftinterface' | head -1)
          echo "--- 8314"; sed -n 8306,8316p "$F" | cut -c1-300
