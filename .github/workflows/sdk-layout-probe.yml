name: SDK layout probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - run: |
          SEL=$(ls -d /Applications/Xcode_27*.app | grep -viE 'beta|rc|preview' | sort -V | tail -1)
          export DEVELOPER_DIR="$SEL/Contents/Developer"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          F=$(find $SDK/System/Library/Frameworks/FoundationModels.framework -name 'arm64e-apple-ios.swiftinterface' | head -1); echo "$F"; wc -l "$F"
          for pat in "protocol Generable" "protocol ConvertibleFromGeneratedContent" "protocol ConvertibleToGeneratedContent" "protocol InstructionsRepresentable" "struct GenerationSchema" "struct DynamicGenerationSchema" "struct GeneratedContent"; do
            echo "=== $pat"; L=$(grep -n "$pat" "$F" | head -1 | cut -d: -f1); [ -n "$L" ] && sed -n "$((L-3)),$((L+30))p" "$F" | cut -c1-240
          done
