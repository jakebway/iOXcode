name: SDK layout probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - run: |
          SEL=$(ls -d /Applications/Xcode_27*.app | grep -viE 'beta|rc|preview' | sort -V | tail -1)
          export DEVELOPER_DIR="$SEL/Contents/Developer"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          TC=$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr
          echo "--- host plugins"; ls $TC/lib/swift/host/plugins 2>&1 | head -30
          echo "--- sdk macro plugins"; find $SDK $DEVELOPER_DIR/Platforms/iPhoneOS.platform -iname '*Macros*' -maxdepth 8 2>/dev/null | head -20
          M=$(find $SDK/System/Library/Frameworks/SwiftUI.framework -name '*.swiftinterface' | grep -v private | head -3); echo "$M"
          for f in $M; do echo "=== $f"; grep -n "macro \|@attached\|@freestanding" "$f" | head -60 | cut -c1-260; done
          F=$(echo "$M" | head -1)
          echo "--- State decl"; grep -n "struct State\b\|struct State<\|propertyWrapper" "$F" | head -20 | cut -c1-200
