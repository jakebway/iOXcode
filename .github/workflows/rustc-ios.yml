name: Rust on device - build rustc for iPhone (spike)

# Can the real Rust compiler be built as an iPhone program? Builds rustc (host = aarch64-apple-ios) from the
# official sources, with the one target-spec change the rustc-on-iOS write-ups use (allow dynamic linking).
# Long (LLVM for iOS is built from source). Logs go to the ci-logs branch. Output: size of what was built.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Rust release tag"
        default: "1.90.0"

permissions:
  contents: write

concurrency:
  group: rustc-ios
  cancel-in-progress: false

jobs:
  rustc:
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Rust sources
        run: |
          mkdir -p ci-out
          git clone -q --depth 1 --branch "${{ inputs.tag || '1.90.0' }}" https://github.com/rust-lang/rust "$RUNNER_TEMP/rust"
          cd "$RUNNER_TEMP/rust"
          git submodule update -q --init --depth 1 src/llvm-project library/backtrace src/tools/cargo 2>&1 | tail -3 || true
          grep -rn "dynamic_linking" compiler/rustc_target/src/spec/base/apple/ compiler/rustc_target/src/spec/targets/aarch64_apple_ios.rs | tee "$GITHUB_WORKSPACE/ci-out/dynamic_linking-before.txt" || true
      - name: Allow dynamic linking for iOS
        run: |
          cd "$RUNNER_TEMP/rust"
          f=compiler/rustc_target/src/spec/base/apple/mod.rs
          grep -n "dynamic_linking" "$f" || true
          # the base spec turns dynamic linking off for the iOS-family OSes; turn it on
          python3 - "$f" <<'P'
          import re,sys
          p=sys.argv[1]; s=open(p).read()
          n=s.count("dynamic_linking: false")
          s=s.replace("dynamic_linking: false","dynamic_linking: true")
          open(p,"w").write(s); print("patched",n)
          P
          git diff --stat | tee "$GITHUB_WORKSPACE/ci-out/patch.txt"
      - name: C entry point for iOXcode
        run: |
          cd "$RUNNER_TEMP/rust"
          # rustc's own main() ends with process::exit, which would close iOXcode. This entry runs one compile and
          # returns its exit code instead; iOXcode loads the library and calls it like the swift and clang drivers.
          cat >> compiler/rustc_driver/src/lib.rs <<'RS'

          static IOX_INIT: std::sync::Once = std::sync::Once::new();

          /// iOXcode: run one `rustc` command line in this process and return its exit code (0 = success).
          #[unsafe(no_mangle)]
          pub unsafe extern "C" fn ioxrustc_main(argc: std::ffi::c_int, argv: *const *const std::ffi::c_char) -> std::ffi::c_int {
              let mut args: Vec<String> = Vec::new();
              for i in 0..argc as isize {
                  let p = unsafe { *argv.offset(i) };
                  if p.is_null() { break; }
                  args.push(unsafe { std::ffi::CStr::from_ptr(p) }.to_string_lossy().into_owned());
              }
              IOX_INIT.call_once(|| {
                  rustc_driver_impl::install_ice_hook(rustc_driver_impl::DEFAULT_BUG_REPORT_URL, |_| ());
              });
              let mut callbacks = rustc_driver_impl::TimePassesCallbacks::default();
              rustc_driver_impl::catch_with_exit_code(|| rustc_driver_impl::run_compiler(&args, &mut callbacks))
          }
          RS
          tail -25 compiler/rustc_driver/src/lib.rs
      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/rust/build/aarch64-apple-darwin/llvm
            ${{ runner.temp }}/rust/build/aarch64-apple-ios/llvm
          key: rustc-ios-llvm-${{ inputs.tag || '1.90.0' }}
      - name: Configure
        run: |
          cd "$RUNNER_TEMP/rust"
          cat > config.toml <<'C'
          change-id = "ignore"
          [llvm]
          download-ci-llvm = false
          ninja = true
          [build]
          build = "aarch64-apple-darwin"
          host = ["aarch64-apple-darwin", "aarch64-apple-ios"]
          target = ["aarch64-apple-darwin", "aarch64-apple-ios"]
          docs = false
          extended = false
          tools = []
          [rust]
          channel = "nightly"
          lld = false
          C
          brew install ninja cmake 2>&1 | tail -1
      - name: Build rustc for iOS
        id: build
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/rust"
          export IPHONEOS_DEPLOYMENT_TARGET=16.0
          python3 x.py build --stage 2 --host aarch64-apple-ios --target aarch64-apple-ios compiler/rustc library/std 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/build.log" | tail -n 40
      - name: What came out
        if: always()
        run: |
          cd "$RUNNER_TEMP/rust"
          find build/aarch64-apple-darwin -path '*aarch64-apple-ios*' \( -name 'librustc_driver*' -o -name 'rustc-main*' \) -maxdepth 7 -exec ls -lh {} \; 2>/dev/null | head -20 | tee "$GITHUB_WORKSPACE/ci-out/products.txt"
          tail -n 120 "$GITHUB_WORKSPACE/ci-out/build.log" > "$GITHUB_WORKSPACE/ci-out/build-tail.txt" || true
      - name: Inspect and package
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/rust"
          D=$(find build/aarch64-apple-darwin -name librustc_driver.dylib -path '*aarch64-apple-ios/release*' | head -1)
          echo "driver: $D" | tee -a "$GITHUB_WORKSPACE/ci-out/inspect.txt"
          [ -n "$D" ] || exit 0
          vtool -show-build "$D" 2>&1 | tee -a "$GITHUB_WORKSPACE/ci-out/inspect.txt"
          file "$D" | tee -a "$GITHUB_WORKSPACE/ci-out/inspect.txt"
          otool -L "$D" | head -30 | tee -a "$GITHUB_WORKSPACE/ci-out/inspect.txt"
          nm -gU "$D" | grep -E "ioxrustc_main|rustc_driver.*main|run_compiler" | head -20 | tee -a "$GITHUB_WORKSPACE/ci-out/inspect.txt"
          S=build/host/stage2
          ls "$S/lib" "$S/lib/rustlib" 2>&1 | head -20 | tee -a "$GITHUB_WORKSPACE/ci-out/inspect.txt"
          ls "$S/lib/rustlib/aarch64-apple-ios/lib" 2>&1 | head -40 | tee -a "$GITHUB_WORKSPACE/ci-out/inspect.txt"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$D" "$RUNNER_TEMP/out/librustc_driver.dylib"
          strip -x "$RUNNER_TEMP/out/librustc_driver.dylib" || true
          ls -l "$RUNNER_TEMP/out" | tee -a "$GITHUB_WORKSPACE/ci-out/inspect.txt"
          [ -d "$S/lib/rustlib/aarch64-apple-ios" ] && tar -C "$S/lib/rustlib" -czf "$RUNNER_TEMP/out/rustlib-aarch64-apple-ios.tar.gz" aarch64-apple-ios
          ls -l "$RUNNER_TEMP/out"
          (cd "$RUNNER_TEMP/out" && zip -q librustc_driver.dylib.zip librustc_driver.dylib)
          TAG="rustc-ios-${{ inputs.tag || '1.90.0' }}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$RUNNER_TEMP/out/librustc_driver.dylib.zip" "$RUNNER_TEMP/out/rustlib-aarch64-apple-ios.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --title "rustc for iPhone $TAG" --notes "rustc ${{ inputs.tag || '1.90.0' }} built to run on iOS (aarch64-apple-ios host)" || true
      - name: Publish logs to the ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/push-logs.sh ci-out "rustc-ios-${{ github.run_id }}"
