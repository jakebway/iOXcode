name: Probe - why 'import WebKit' is not found

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Look
        run: |
          mkdir -p ci-out
          exec > >(tee ci-out/webkit.txt) 2>&1
          SEL=$(ls -d /Applications/Xcode*.app | grep -viE 'beta|rc|preview' | sort -V | tail -1)
          SEL=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$SEL")
          export DEVELOPER_DIR="$SEL/Contents/Developer"
          echo "Xcode: $SEL"; swiftc --version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path); echo "SDK $SDK"
          TC=$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr
          F="$SDK/System/Library/Frameworks"
          ls -ld "$F/WebKit.framework"; readlink "$F/WebKit.framework" || true
          echo "--- symlinks among frameworks"; find "$F" -maxdepth 1 -type l -exec ls -l {} \; | head -20
          echo "--- WebKit (follow)"; find -L "$F/WebKit.framework" -maxdepth 2 | grep -v Headers/ | head -20
          echo "--- all symlinks in SDK (count/targets outside)"; find "$SDK" -type l | wc -l; find "$SDK" -type l -exec readlink {} \; | grep -c '^/' || true
          echo "--- where is real WebKit"; ls -la "$F" | grep -i webkit
      - name: Publish logs
        if: always()
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: scripts/ci/push-logs.sh ci-out "webkit-${{ github.run_id }}"
