name: ScriptIcon
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  ScriptIcon:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    preBuildScripts:
      - name: Draw the app icon
        script: |
          set -e
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.new("RGB", (1024, 1024), (30, 80, 200))
          d = ImageDraw.Draw(im)
          d.ellipse((212, 212, 812, 812), fill=(255, 220, 80))
          im.save("Assets.xcassets/AppIcon.appiconset/icon.png")
          print("icon drawn")
          PY
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.scripticon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
