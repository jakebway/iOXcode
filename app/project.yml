name: iOXcode
options:
  bundleIdPrefix: com.jakebway
  deploymentTarget:
    iOS: "18.0"
packages:
  AssetKit:
    path: Vendor/AssetKit
  WasmKit:
    url: https://github.com/swiftwasm/WasmKit
    exactVersion: 0.5.0
targets:
  iOXcode:
    type: application
    platform: iOS
    sources:
      - path: iOXcode
    dependencies:
      - package: AssetKit
        product: AssetKit
      - package: WasmKit
        product: WasmKit
      - package: WasmKit
        product: WasmKitWASI
    postBuildScripts:
      - name: Embed compiler, Rust, Python and clang headers
        script: python3 Scripts/embed_payload.py
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakebway.ioxcode
        PRODUCT_NAME: iOXcode
        INFOPLIST_FILE: iOXcode/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: iOXcode/Bridge.h
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
